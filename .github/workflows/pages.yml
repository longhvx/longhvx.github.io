name: Build site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TECTONIC_VERSION: 0.17.0

jobs:
  pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install tectonic
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" tectonic
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache LaTeX packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ hashFiles('scripts/build_cv_tex.mjs') }}
          restore-keys: tectonic-${{ env.TECTONIC_VERSION }}-

      - name: Generate LaTeX from data.json
        run: node scripts/build_cv_tex.mjs data.json build/cv.tex

      - name: Compile PDF
        run: tectonic -X compile build/cv.tex --outdir build

      - uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: build/cv.pdf
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Build preview image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/og-image/package-lock.json

      - name: Generate social preview image
        run: |
          npm ci --prefix tools/og-image --no-audit --no-fund
          node tools/og-image/render.mjs render data.json build/preview.png

      - uses: actions/upload-artifact@v7
        with:
          name: preview-png
          path: build/preview.png
          if-no-files-found: error
          retention-days: 1

  site:
    name: Build site
    needs: [pdf, preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: build

      - uses: actions/download-artifact@v8
        with:
          name: preview-png
          path: build

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html data.json site.webmanifest favicon.ico favicon-*.png apple-touch-icon.png images scripts styles _site/
          rm _site/scripts/build_cv_tex.mjs
          cp build/cv.pdf _site/cv.pdf
          cp build/preview.png _site/images/preview.png

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
