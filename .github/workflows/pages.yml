name: Build site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 3

  # Read by the "PR preview" workflow, which publishes the preview and comments.
  pr-meta:
    name: Record PR details
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write PR details
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir pr-meta
          printf '{"number": %s, "head_sha": "%s"}\n' "$PR_NUMBER" "$HEAD_SHA" > pr-meta/pr.json
          cat pr-meta/pr.json

      - uses: actions/upload-artifact@v7
        with:
          name: pr-meta
          path: pr-meta/pr.json
          retention-days: 3

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
